
name: Build Aviator Research Lab APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "AviatorResearchLab.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "AviatorResearchLab.zip was not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_ROOT=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          if [ -z "$PROJECT_ROOT" ] || [ "$PROJECT_ROOT" = "extracted" ]; then
            echo "Android project files were not found in the ZIP"
            exit 1
          fi
          cp -R "$PROJECT_ROOT"/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aviator-Research-Lab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
